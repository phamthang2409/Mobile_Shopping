version: '3.8'

services:
  # Backend .NET Core
  backend:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    volumes:
      - ./Backend/Shopping_Mobile:/app 
    working_dir: /app
    command: dotnet watch run --urls=http://0.0.0.0:7180
    ports:
      - "7180:7180"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=MobileShoppingDb;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True

  # Frontend ReactJS
  frontend:
    image: node:18-alpine
    volumes:
      - ./Frontend:/app
    working_dir: /app
    command: sh -c "PORT=3001 npm start"
    ports:
      - "3001:3001" 
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Database SQL Server
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_MobileShoppingDb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourPassword123!
      - SA_PASSWORD=YourPassword123!
    ports:
      - "1433:1433"